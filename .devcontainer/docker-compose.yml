services:
  # Main dev container where you run scripts
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspaces/lab1NetworkApplications
    init: true
    # Give the dev container a little time before sidecars
    depends_on:
      - juice-shop
      - httpbin
      - smb

  # Sidecar: Juice Shop (intentionally vulnerable web app) on :3000
  juice-shop:
    image: ghcr.io/bkimminich/juice-shop:latest   # use GHCR (fewer pull hiccups)
    ports: ["3000:3000"]
    restart: unless-stopped

  # Sidecar: httpbin on :8080
  httpbin:
    image: kennethreitz/httpbin
    ports: ["8080:80"]
    restart: unless-stopped

  # Sidecar: Samba; map container 445 to host 1445 (avoid privileged 445)
  smb:
    image: dperson/samba
    command: >
      -p
      -s "public;/shares/public;yes;no;yes"
      -u "guest;guest"
    environment:
      - TZ=UTC
    volumes:
      - ../shares/public:/shares/public
    ports:
      - "1445:445"
    restart: unless-stopped
